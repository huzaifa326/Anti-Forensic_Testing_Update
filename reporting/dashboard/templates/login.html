{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 450px; margin: 60px auto;">
    <div class="card-header">
        <div class="card-title"><i class="fa-solid fa-right-to-bracket" style="color:var(--accent-light);"></i> Login to CyberForensX</div>
    </div>
    <form method="POST" action="{{ url_for('login') }}" style="padding: 10px;">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username" required autocomplete="username">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 15px; justify-content: center; height: 42px;">
            <i class="fa-solid fa-arrow-right-to-bracket"></i> Login
        </button>
    </form>
    <div style="text-align: center; margin-top: 10px; margin-bottom: 5px;">
        <p class="meta-text" style="font-size: 0.9rem;">
            Don't have an account? <a href="{{ url_for('signup') }}" style="color: var(--accent-light); font-weight: 500; text-decoration: none;">Sign Up</a>
        </p>
    </div>
</div>
{% endblock %}
